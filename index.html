;line-height:1.7}.clientinfo a{color:#356c53}.clientinfo strong{font-size:20px}.clientinfo small{font-size:11px}.tasks{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.task{background:white;border:1px solid #dce3d6;border-radius:10px;padding:24px}.task.done{border-color:#86b095}.tasktop{display:flex;gap:15px}.num{font-size:12px;color:#8ca086}.task h2{font-size:16px;margin:0 0 12px}.task p{font-size:13px;color:#73806d;line-height:1.7;margin:0}.taskactions{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #edf0e9;margin-top:24px;padding-top:18px;font-size:12px}.check{display:flex;gap:8px;align-items:center}.check input{width:20px;height:20px;accent-color:#356c53}.photo{background:#edf3e9;padding:10px;border-radius:6px;color:#356c53;cursor:pointer}.photo input{display:none}.task img{width:100%;max-height:240px;object-fit:contain;margin-top:18px;border-radius:5px}.task>small{display:block;font-size:10px;color:#7a8775;margin-top:12px}.photo-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.photo-links a{font-size:12px;color:#245e45;background:#edf4ed;padding:9px;border-radius:6px}.uploadstatus{background:#eef5ef;padding:14px;border-radius:8px;margin:12px 0;font-size:13px}.uploadtrack{height:9px;border-radius:6px;background:#cbd9cf;margin:10px 0;overflow:hidden}.uploadtrack span{display:block;background:#317552;height:100%;transition:width .3s}.uploadstatus small{color:#53665a}.notice{padding:14px;border-radius:6px;background:#fff0d7;font-size:13px}footer{text-align:center;font-size:11px;color:#8b9585;margin:50px 0 15px}footer span{margin:0 12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.calendar{grid-template-columns:repeat(3,1fr)}h1{font-size:30px}.heading{align-items:flex-start;gap:20px}.summary>span{display:none}.tasks{grid-template-columns:1fr}}@media(max-width:550px){header{height:70px}.tag{font-size:8px;letter-spacing:1px}main{padding:20px 16px}.heading{flex-direction:column;margin </style></head><body><div id="root"></div><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
'use strict';
const WEBAPP='https://script.google.com/macros/s/AKfycbztllBHHkigJK5vm0Wpn5sjhP3G6wrDEWL--_RjNuWvkgj43uTgVZs4mlBn4FUpstGoXQ/exec';
const DAYS=['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const root=document.getElementById('root');
const BUILD='TGR • ENVIO POR CLIENTE • v4';
const state={data:null,promoter:null,day:null,visit:null,week:weekMonday(new Date()),records:{},notes:{},busy:false,message:'',drafts:{},uploadProgress:null};
function weekMonday(d){d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return fmt(d)}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayDate(day){const d=new Date(state.week+'T12:00:00');d.setDate(d.getDate()+day);return fmt(d)}
function dateBR(s){return new Date(s+'T12:00:00').toLocaleDateString('pt-BR')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getCell(row,i){return String(row?.[i]??'').trim()}
function parseWorkbook(bytes){
 if(!window.XLSX)throw Error('Biblioteca Excel indisponível.');
 const book=XLSX.read(bytes,{type:'array'});
 const farol=book.Sheets.FAROL?XLSX.utils.sheet_to_json(book.Sheets.FAROL,{header:1,defval:''}):[];
 const promoters=farol.slice(1).map(r=>getCell(r,1)).filter(n=>n&&book.Sheets[n]);
 if(!promoters.length)throw Error('Promotores não encontrados na aba FAROL.');
 const visits=[];
 for(const promoter of promoters){
  const rows=XLSX.utils.sheet_to_json(book.Sheets[promoter],{header:1,defval:''});
  const header=(rows[2]||[]).map(v=>String(v||'').trim().toUpperCase());
  const starts=[];
  for(let c=0;c<header.length-3;c++){
   if(/^C[ÓO]D\.?$/.test(header[c])&&header[c+1].startsWith('CLIENTE')&&header[c+2].startsWith('EQUIPAMENTO')&&header[c+3].startsWith('ATIVIDADE'))starts.push(c);
  }
  if(starts.length!==6)throw Error('Colunas Código / Cliente / Equipamento / Atividade inválidas na aba '+promoter+' (encontradas '+starts.length+' sequências).');
  for(let day=0;day<6;day++){
   const col=starts[day];let current=null;
   for(let ri=3;ri<rows.length;ri++){
    const row=rows[ri]||[];
    const code=getCell(row,col),name=getCell(row,col+1),equipment=getCell(row,col+2),activity=getCell(row,col+3);
    if(code){
      current={id:promoter+'-'+day+'-'+code,promoter,day,client:{code,name:name||code},tasks:[]};
      visits.push(current);
    }
    if(current&&(equipment||activity))current.tasks.push({id:String(ri+1),equipment,activity});
   }
  }
 }
 return {promoters,visits};
}
function keyFor(v,t){return dayDate(v.day)+'|'+v.id+'|'+t.id}
function progress(v){return v.tasks.filter(t=>state.records[keyFor(v,t)]?.done).length}
function recordsCache(){try{return JSON.parse(localStorage.getItem('tgr-agenda-online-v2')||'{}')}catch{return {}}}
function saveCache(){try{localStorage.setItem('tgr-agenda-online-v2',JSON.stringify(state.records))}catch{}}
function status(keys,timeout=18000,uploadIds=[]){return new Promise((resolve,reject)=>{let cb='tgrStatus_'+Date.now()+'_'+Math.floor(Math.random()*1e6);let script=document.createElement('script');let finished=false;function finish(err,data){if(finished)return;finished=true;clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(data)}window[cb]=data=>finish(null,data);script.onerror=()=>finish(Error('Consulta indisponível'));const timer=setTimeout(()=>finish(Error('Tempo de consulta excedido')),timeout);script.src=WEBAPP+'?action=status&keys='+encodeURIComponent(keys.join(','))+'&uploadIds='+encodeURIComponent(uploadIds.join(','))+'&callback='+cb+'&v='+Date.now();document.head.appendChild(script)})}
async function sync(){if(!state.data)return;const keys=state.data.visits.flatMap(v=>v.tasks.map(t=>keyFor(v,t)));try{for(let i=0;i<keys.length;i+=45){const result=await status(keys.slice(i,i+45));if(!result.ok)continue;for(const rec of result.records||[]){state.records[rec.key]={...state.records[rec.key],done:rec.status==='CONCLUIDA',photoUrl:rec.photoUrl,photoUrls:rec.photoUrls,updated:rec.updated,note:rec.note||''}}}saveCache();render()}catch(e){console.warn('Sincronização:',e.message)}}
// Rascunhos locais: fotografias comprimidas e observações em IndexedDB, não em localStorage.
const draftDB=new Promise((resolve,reject)=>{const req=indexedDB.open('tgr-rascunhos-v4',1);req.onupgradeneeded=()=>req.result.createObjectStore('tasks');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function draftStore(mode,action){const db=await draftDB;return new Promise((resolve,reject)=>{const tx=db.transaction('tasks',mode),store=tx.objectStore('tasks');let req=action(store);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function draftRead(key){return await draftStore('readonly',s=>s.get(key))||{note:'',photos:[]}}
async function draftWrite(key,d){state.drafts[key]=d;await draftStore('readwrite',s=>s.put(d,key))}
async function loadDrafts(v){if(!v)return;for(const t of v.tasks){const key=keyFor(v,t);try{state.drafts[key]=await draftRead(key)}catch(e){console.warn('Armazenamento indisponível',e)}}render()}
function draftFor(key){return state.drafts[key]||{note:'',photos:[]}}
function uid(){return 'tgr_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
async function stagePhotos(v,t,files){const key=keyFor(v,t);try{const draft=await draftRead(key);for(const file of files){if(!file.type.startsWith('image/'))throw Error('Escolha fotografias válidas.');const photo=await photoData(file);draft.photos.push({id:uid(),name:file.name||'Foto',data:photo})}await draftWrite(key,draft);state.message='Fotografias guardadas neste aparelho. Envie ao finalizar o cliente.';render()}catch(err){state.message='Não foi possível guardar as fotos: '+err.message+'. Verifique o espaço livre do aparelho.';render()}}
async function removePhoto(v,t,id){const key=keyFor(v,t),d=await draftRead(key);d.photos=d.photos.filter(p=>p.id!==id);await draftWrite(key,d);render()}
async function saveNote(key,value){const d=await draftRead(key);d.note=value;await draftWrite(key,d)}
function stagedCount(v){return v.tasks.reduce((n,t)=>n+draftFor(keyFor(v,t)).photos.length,0)}
async function checkUpload(uploadId){const res=await status([],18000,[uploadId]);return (res.uploads||[]).find(x=>x.uploadId===uploadId&&x.saved)?.result||null}
async function finishClient(v){
if(state.busy)return;
const pending=[],missing=[];
for(const t of v.tasks){
 const key=keyFor(v,t);
 const field=document.getElementById('note-'+t.id);
 if(field)await saveNote(key,field.value);
 const d=await draftRead(key);
 state.drafts[key]=d;
 if(!state.records[key]?.done && !d.photos.length)missing.push(t.equipment||'Equipamento não informado');
 for(const photo of d.photos)pending.push({t,key,photo,note:d.note||''});
}
if(missing.length){
 const names=missing.slice(0,6).map((name,i)=>(i+1)+'. '+name).join('\n');
 const extra=missing.length>6?'\n... e mais '+(missing.length-6)+' atividade(s).':'';
 const message='ATENÇÃO: '+missing.length+' atividade(s) estão sem fotografia.\n\n'+names+extra+'\n\nEssas atividades permanecerão pendentes e sem comprovação fotográfica.\n\nDeseja continuar e enviar apenas as fotografias e observações das atividades preparadas?';
 if(!window.confirm(message)){state.message='Envio cancelado. Você pode anexar as fotos que faltam antes de finalizar.';render();return;}
}
if(!pending.length){state.message='Não há fotografias novas para enviar. Nenhuma atividade foi marcada como concluída.';render();return;}

state.busy=true;let completed=0;state.uploadProgress={completed,total:pending.length};render();
try{for(const item of pending){state.message='Enviando fotografia '+(completed+1)+' de '+pending.length+'...';render();let result;
try{result=await send({action:'save',uploadId:item.photo.id,key:item.key,promoter:v.promoter,date:dayDate(v.day),clientCode:v.client.code,clientName:v.client.name,taskId:item.t.id,equipment:item.t.equipment,description:item.t.activity,note:item.note,photo:item.photo.data})}
catch(error){state.message='Conferindo a confirmação da fotografia '+(completed+1)+'...';render();try{result=await checkUpload(item.photo.id)}catch{}if(!result)throw Error('Não foi possível confirmar o envio. '+error.message)}
const d=await draftRead(item.key);d.photos=d.photos.filter(p=>p.id!==item.photo.id);await draftWrite(item.key,d);
state.records[item.key]={...state.records[item.key],done:true,photoUrl:result.photoUrl,photoUrls:result.photoUrls,updated:result.updated,note:item.note};saveCache();completed++;state.uploadProgress={completed,total:pending.length};render()}
state.message='Atendimento enviado! '+completed+' fotografia(s) confirmada(s).';await sync()}
catch(err){state.message=err.message+' As fotos ainda não confirmadas continuam guardadas neste aparelho. Confira o painel antes de tentar novamente.'}
finally{state.busy=false;state.uploadProgress=null;render()}}
function photoData(file){return new Promise((resolve,reject)=>{if(!/^image\/(jpeg|png|webp)$/.test(file.type))return reject(Error('Escolha JPG, PNG ou WEBP.'));let reader=new FileReader;reader.onerror=()=>reject(Error('Falha ao ler fotografia'));reader.onload=()=>{let img=new Image;img.onerror=()=>reject(Error('Imagem inválida'));img.onload=()=>{let ratio=Math.min(1,1400/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.75);if(data.length>6800000)return reject(Error('Fotografia muito grande'));resolve(data)};img.src=reader.result};reader.readAsDataURL(file)})}
function send(payload){return new Promise((resolve,reject)=>{let id='tgrFrame_'+Date.now()+'_'+Math.random().toString(36).slice(2);let iframe=document.createElement('iframe');iframe.name=id;iframe.hidden=true;let form=document.createElement('form');form.method='POST';form.action=WEBAPP;form.target=id;form.hidden=true;let done=false;function finish(err,data){if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',onMessage);setTimeout(()=>{iframe.remove();form.remove()},1500);err?reject(err):resolve(data)}function onMessage(ev){if(!/^https:\/\/(script\.google\.com|([a-z0-9-]+\.)?googleusercontent\.com)$/.test(ev.origin))return;let msg=ev.data;try{if(typeof msg==='string')msg=JSON.parse(msg)}catch{}if(msg?.type!=='TGR_SAVE_RESULT'||msg.key!==payload.key)return;msg.ok?finish(null,msg):finish(Error(msg.error||'Falha no registro'))}window.addEventListener('message',onMessage);let timer=setTimeout(()=>finish(Error('Confirmação demorou')),65000);for(let [k,v] of Object.entries(payload)){let inp=document.createElement('input');inp.name=k;inp.type='hidden';inp.value=String(v??'');form.appendChild(inp)}document.body.append(iframe,form);form.submit()})}
function setMessage(msg){state.message=msg;render()}
async function upload(v,task,files){if(state.busy)return;const list=[...files];if(!list.length)return;state.busy=true;const key=keyFor(v,task);const note=document.getElementById('note-'+task.id)?.value.trim()||'';state.notes[key]=note;render();try{for(let i=0;i<list.length;i++){setMessage('Enviando fotografia '+(i+1)+' de '+list.length+'...');const photo=await photoData(list[i]);const uploadId='tgr_'+Date.now()+'_'+Math.random().toString(36).slice(2);let result;try{result=await send({action:'save',uploadId,key,promoter:v.promoter,date:dayDate(v.day),clientCode:v.client.code,clientName:v.client.name,taskId:task.id,equipment:task.equipment,description:task.activity,note,photo})}catch(err){setMessage('Conferindo se a fotografia foi registrada...');let resultStatus=await status([key]).catch(()=>null);const rec=resultStatus?.records?.find(x=>x.key===key);if(!rec||!rec.photoUrls?.length)throw err;result={...rec,ok:true}}state.records[key]={...state.records[key],done:true,photoUrl:result.photoUrl,photoUrls:result.photoUrls,updated:result.updated,note};saveCache()};setMessage('Atividade registrada. '+list.length+' fotografia(s) enviada(s).')}catch(e){setMessage('Não foi possível confirmar: '+e.message+'. Confira o painel antes de reenviar.')}finally{state.busy=false;render()}}
function navigatePromoter(n){if(state.busy)return;state.promoter=n;state.day=null;state.visit=null;state.message='';render()}
function navigateDay(n){if(state.busy)return;state.day=n;state.visit=null;state.message='';render()}
function navigateVisit(id){if(state.busy)return;state.visit=id;state.message='';render();loadDrafts(state.data.visits.find(v=>v.id===id))}
function goBack(){if(state.busy)return;if(state.visit){state.visit=null}else if(state.day!==null){state.day=null}else{state.promoter=null}state.message='';render()}
function moveWeek(n){let d=new Date(state.week+'T12:00:00');d.setDate(d.getDate()+7*n);state.week=fmt(d);state.records=recordsCache();render();sync()}
function render(){if(!state.data){root.innerHTML='<main><h1>Agenda de Promotores</h1><p>'+esc(state.message||'Carregando planilha...')+'</p></main>';return}const data=state.data;const selected=state.visit?data.visits.find(v=>v.id===state.visit):null;const visits=state.promoter!==null&&state.day!==null?data.visits.filter(v=>v.promoter===state.promoter&&v.day===state.day):[];let heading=selected?selected.client.name:state.day!==null?DAYS[state.day]:state.promoter||'Agenda de Promotores';let subtitle=selected?'Confira cada equipamento, atividade e registre o trabalho realizado.':state.day!==null?'Selecione o cliente para iniciar o atendimento.':state.promoter?'Escolha um dia para consultar a programação.':'Selecione seu nome para acessar a programação semanal.';
let html='<header><div class="brand">TGR <span>ROTINA EM CAMPO</span></div><span class="tag">PROMOTORES • VENDAS</span></header><main><nav>'+(state.promoter?'<button class="back" data-action="back">← Voltar</button>':'')+'<button data-action="home">Agenda</button>'+(state.promoter?'<span>/</span><button data-action="promoter">'+esc(state.promoter)+'</button>':'')+(state.day!==null?'<span>/</span><button data-action="day">'+DAYS[state.day]+'</button>':'')+'</nav><div class="heading"><div><p class="eyebrow">PLANEJAMENTO & EXECUÇÃO</p><h1>'+esc(heading)+'</h1><p class="sub">'+esc(subtitle)+'</p></div><div class="week"><button data-action="prev" '+(state.busy?'disabled':'')+'>‹</button><div><small>PERÍODO DA SEMANA</small><strong>'+dateBR(state.week)+' a '+dateBR(dayDate(5))+'</strong></div><button data-action="next" '+(state.busy?'disabled':'')+'>›</button></div></div>';
if(state.message)html+='<p class="notice" role="status">'+esc(state.message)+'</p>';
if(!state.promoter){html+='<div class="summary"><strong>'+String(data.promoters.length).padStart(2,'0')+' <small>promotores</small></strong><strong>'+data.visits.length+' <small>visitas na rotina semanal</small></strong><span>Uma semana organizada.<br>Cada atividade acompanhada.</span></div><div class="grid">';for(let i=0;i<data.promoters.length;i++){let name=data.promoters[i];html+='<button class="card promoter" data-promoter="'+esc(name)+'"><span class="avatar">'+esc(name.split(' ').slice(0,2).map(x=>x[0]).join(''))+'</span><span><small>PROMOTOR '+String(i+1).padStart(2,'0')+'</small><strong>'+esc(name)+'</strong><p>'+data.visits.filter(v=>v.promoter===name).length+' clientes programados na semana</p></span><b>↗</b></button>'}html+='</div>'}
else if(state.day===null){html+='<div class="calendar">';for(let d=0;d<6;d++){let count=data.visits.filter(v=>v.promoter===state.promoter&&v.day===d).length;html+='<button class="card day" data-day="'+d+'"><small>'+DAYS[d]+'</small><strong>'+new Date(dayDate(d)+'T12:00:00').getDate()+'</strong><span>'+count+' clientes</span><em>'+(count?'Ver programação →':'Sem programação')+'</em></button>'}html+='</div>'}
else if(!selected){html+='<div class="bar"><p>'+visits.length+' clientes programados · '+dateBR(dayDate(state.day))+'</p></div><div class="grid">';for(const v of visits){const done=progress(v),total=v.tasks.length;html+='<button class="card client" data-visit="'+esc(v.id)+'"><h2>'+esc(v.client.name)+'</h2><small>Código: '+esc(v.client.code)+'</small><div class="progress"><span style="width:'+(total?done/total*100:0)+'%"></span></div><span>'+done+'/'+total+' atividades concluídas</span></button>'}html+='</div>'}
else{html+='<section class="clientinfo"><span>Código: '+esc(selected.client.code)+'</span><strong>'+progress(selected)+'/'+selected.tasks.length+' <small>concluídos</small></strong></section><div class="tasks">';for(let i=0;i<selected.tasks.length;i++){const t=selected.tasks[i],key=keyFor(selected,t),r=state.records[key],photos=r?.photoUrls|| (r?.photoUrl?[r.photoUrl]:[]),draft=draftFor(key),note=draft.note||r?.note||'';html+='<section class="task '+(r?.done?'done':'')+'"><div class="tasktop"><span class="num">'+String(i+1).padStart(2,'0')+'</span><div><h2>'+esc(t.equipment||'Equipamento não informado')+'</h2><p>'+esc(t.activity||'Atividade não informada')+'</p></div></div><label class="note-label" for="note-'+esc(t.id)+'">Observação (opcional)</label><textarea class="note" id="note-'+esc(t.id)+'" data-note="'+esc(key)+'" placeholder="Registre alguma ocorrência ou observação" '+(state.busy?'disabled':'')+'>'+esc(note)+'</textarea><div class="taskactions"><label class="check"><input type="checkbox" disabled '+(r?.done?'checked':'')+'>'+(r?.done?'Realizada no servidor':'Pendente de envio')+'</label><label class="photo">📷 Selecionar fotos<input type="file" accept="image/*" capture="environment" multiple data-stage="'+esc(t.id)+'" '+(state.busy?'disabled':'')+'></label></div>'+(draft.photos.length?'<div class="draftphotos">'+draft.photos.map((p,j)=>'<span class="draftphoto">📷 '+esc(p.name||'Foto '+(j+1))+' <button type="button" data-remove="'+esc(t.id)+'" data-photoid="'+esc(p.id)+'" '+(state.busy?'disabled':'')+'>Remover</button></span>').join('')+'</div>':'')+'<span class="draftlabel">'+draft.photos.length+' foto(s) preparada(s) para envio</span>'+(photos.length?'<div class="photo-links">'+photos.map((url,j)=>'<a href="'+esc(url)+'" target="_blank" rel="noopener">📷 Ver foto '+(j+1)+' ↗</a>').join('')+'</div>':'')+'</section>'}html+='</div><div class="finish"><strong>Finalizar atendimento de '+esc(selected.client.name)+'</strong><p class="sub">'+stagedCount(selected)+' fotografia(s) aguardando envio. As observações e fotos selecionadas ficam guardadas neste aparelho até a confirmação.</p>'+(state.uploadProgress?'<div class="uploadstatus"><strong>Enviando: '+state.uploadProgress.completed+'/'+state.uploadProgress.total+' fotografias</strong><div class="uploadtrack"><span style="width:'+(100*state.uploadProgress.completed/state.uploadProgress.total)+'%"></span></div></div>':'')+'<button class="primary" data-finish="1" '+(state.busy?'disabled':'')+'>📤 Finalizar atendimento e enviar tudo</button></div>'}
html+='<footer><strong>'+BUILD+'</strong><br>TGR ENVIO PARCIAL • v5 • 09/10/2026<br>Atividades concluídas com fotografia são enviadas ao painel do supervisor.<br>A programação é lida da planilha publicada junto com este arquivo.</footer></main>';root.innerHTML=html;
root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{if(state.busy)return;let a=b.dataset.action;if(a==='back')goBack();if(a==='home'){state.promoter=null;state.day=null;state.visit=null;render()}if(a==='promoter'){state.day=null;state.visit=null;render()}if(a==='day'){state.visit=null;render()}if(a==='prev')moveWeek(-1);if(a==='next')moveWeek(1)}));root.querySelectorAll('[data-promoter]').forEach(b=>b.addEventListener('click',()=>navigatePromoter(b.dataset.promoter)));root.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>navigateDay(Number(b.dataset.day))));root.querySelectorAll('[data-visit]').forEach(b=>b.addEventListener('click',()=>navigateVisit(b.dataset.visit)));root.querySelectorAll('[data-note]').forEach(x=>x.addEventListener('change',()=>saveNote(x.dataset.note,x.value).catch(e=>{state.message='Erro ao salvar observação: '+e.message;render()})));root.querySelectorAll('[data-stage]').forEach(x=>x.addEventListener('change',()=>{const t=selected.tasks.find(t=>t.id===x.dataset.stage);if(t&&x.files.length)stagePhotos(selected,t,x.files)}));root.querySelectorAll('[data-remove]').forEach(x=>x.addEventListener('click',()=>{const t=selected.tasks.find(t=>t.id===x.dataset.remove);if(t)removePhoto(selected,t,x.dataset.photoid)}));root.querySelectorAll('[data-finish]').forEach(x=>x.addEventListener('click',()=>finishClient(selected)));}
async function start(){state.records=recordsCache();let errors=[];for(const file of ['Agenda de promotores.xlsx','Agenda%20de%20promotores.xlsx']){try{const res=await fetch('./'+file.replaceAll(' ','%20')+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);state.data=parseWorkbook(await res.arrayBuffer());render();sync();return}catch(e){errors.push(file+': '+e.message)}}state.message='Não foi possível carregar a planilha. Envie Agenda de promotores.xlsx para a mesma pasta do index.html.\n'+errors.join('\n');render()}
start();
</script></body></html>
